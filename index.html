<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>派對注音大挑戰</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            padding: 0;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            background: linear-gradient(135deg, #5374a1 0%, #0f3c96 100%);
            font-family: 'PingFang TC', sans-serif;
            overflow: hidden; /* 防止滾動條影響視覺 */
        }

        #game-container {
            /* 關鍵設定：保持與螢幕邊緣的距離 */
            width: 90vw; 
            max-width: 600px;
            height: 85vh; /* 比螢幕高度小一點 */
            max-height: 500px;
            
            background: white; 
            padding: 20px; 
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #fdcb6e;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            transition: all 0.3s ease; /* 轉向時的平滑過渡 */
        }

        /* 針對橫向螢幕 (Landscape) 的額外微調 */
        @media (orientation: landscape) {
            #game-container {
                height: 90vh; /* 橫向時高度比例調整 */
                width: 80vw;
                max-width: 800px; /* 橫向時允許寬一點 */
            }
            #zhuyin-display { font-size: 150px; } /* 橫向空間多，字體加大 */
        }

        #title { font-size: 1.5rem; color: #2d3436; font-weight: bold; margin: 0; }
        
        #zhuyin-display { 
            font-size:80; 
            font-weight: 900; 
            color: #d63031; 
            word-break: break-all;
            text-align: center;
        }

        button { 
            width: 80%; 
            font-size: 24px; 
            font-weight: bold; 
            padding: 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 50px; 
            background: #6e9bfd; 
            color: #ffffff; 
            box-shadow: 0 5px 0 #726d62;
            transition: 0.1s;
        }

        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #e1b12c; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="title">🎉 派對注音大考驗</div>
        <div id="zhuyin-display">READY</div>
        <button onclick="nextQuestion()">下一個題目 🎁</button>
    </div>

    <script>
        const questions = [
            // 80 題 2 字組
            "ㄍ ㄋ", "ㄐ ㄅ", "ㄍ ㄅ", "ㄇ ㄉ", "ㄊ ㄇ", "ㄙ ㄅ", "ㄎ ㄅ", "ㄒ ㄅ", "ㄅ ㄑ", "ㄈ ㄑ",
            "ㄌ ㄐ", "ㄙ ㄋ", "ㄓ ㄋ", "ㄆ ㄒ", "ㄐ ㄨ", "ㄍ ㄇ", "ㄎ ㄋ", "ㄇ ㄐ", "ㄒ ㄐ", "ㄅ ㄋ",
            "ㄓ ㄅ", "ㄋ ㄉ", "ㄍ ㄨ", "ㄗ ㄞ", "ㄩ ㄉ", "ㄈ ㄕ", "ㄌ ㄏ", "ㄒ ㄒ", "ㄐ ㄗ", "ㄇ ㄅ",
            "ㄎ ㄌ", "ㄕ ㄕ", "ㄒ ㄏ", "ㄓ ㄉ", "ㄋ ㄌ", "ㄅ ㄆ", "ㄊ ㄅ", "ㄍ ㄍ", "ㄐ ㄉ", "ㄕ ㄐ",
            "ㄒ ㄕ", "ㄌ ㄕ", "ㄗ ㄖ", "ㄏ ㄨ", "ㄈ ㄐ", "ㄉ ㄋ", "ㄆ ㄅ", "ㄎ ㄞ", "ㄧ ㄌ", "ㄩ ㄧ",
            "ㄓ ㄓ", "ㄕ ㄨ", "ㄏ ㄏ", "ㄌ ㄎ", "ㄑ ㄔ", "ㄉ ㄒ", "ㄍ ㄆ", "ㄌ ㄌ", "ㄋ ㄋ", "ㄏ ㄐ",
            "ㄇ ㄇ", "ㄗ ㄗ", "ㄉ ㄉ", "ㄅ ㄅ", "ㄈ ㄈ", "ㄎ ㄎ", "ㄒ ㄒ", "ㄕ ㄕ", "ㄔ ㄔ", "ㄖ ㄖ",
            "ㄙ ㄙ", "ㄧ ㄧ", "ㄨ ㄨ", "ㄩ ㄩ", "ㄚ ㄚ", "ㄛ ㄛ", "ㄜ ㄜ", "ㄝ ㄝ", "ㄞ ㄞ", "ㄟ ㄟ",
            // 20 題 3 字組
            "ㄍ ㄋ ㄇ", "ㄋ ㄇ ㄉ", "ㄊ ㄇ ㄉ", "ㄙ ㄋ ㄌ", "ㄐ ㄅ ㄌ", "ㄒ ㄐ ㄐ", "ㄅ ㄎ ㄧ", "ㄨ ㄏ ㄌ", "ㄐ ㄉ ㄈ", "ㄕ ㄐ ㄕ",
            "ㄌ ㄌ ㄌ", "ㄇ ㄕ ㄈ", "ㄍ ㄍ ㄉ", "ㄊ ㄅ ㄖ", "ㄏ ㄨ ㄉ", "ㄒ ㄆ ㄧ", "ㄅ ㄉ ㄌ", "ㄓ ㄋ ㄕ", "ㄎ ㄌ ㄅ", "ㄇ ㄇ ㄉ"
        ];

        function nextQuestion() {
            const display = document.getElementById('zhuyin-display');
            let newIndex = Math.floor(Math.random() * questions.length);
            display.innerText = questions[newIndex];
        }
    </script>
</body>
</html>
