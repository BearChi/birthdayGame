<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>派對注音大挑戰</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            padding: 0;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            background: linear-gradient(135deg, #5374a1 0%, #0f3c96 100%);
            font-family: 'PingFang TC', sans-serif;
            overflow: hidden; /* 防止滾動條影響視覺 */
        }

        #game-container {
            /* 關鍵設定：保持與螢幕邊緣的距離 */
            width: 90vw; 
            max-width: 600px;
            height: 85vh; /* 比螢幕高度小一點 */
            max-height: 500px;
            
            background: white; 
            padding: 20px; 
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid #fdcb6e;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            transition: all 0.3s ease; /* 轉向時的平滑過渡 */
        }

        /* 針對橫向螢幕 (Landscape) 的額外微調 */
        @media (orientation: landscape) {
            #game-container {
                height: 90vh; /* 橫向時高度比例調整 */
                width: 80vw;
                max-width: 800px; /* 橫向時允許寬一點 */
            }
            #zhuyin-display { font-size: 125px; } /* 橫向空間多，字體加大 */
        }

        #title { font-size: 1.5rem; color: #2d3436; font-weight: bold; margin: 0; }
        
        #zhuyin-display { 
            font-size:80px; 
            font-weight: 900; 
            color: #d63031; 
            word-break: break-all;
            text-align: center;
        }

        button { 
            width: 80%; 
            font-size: 24px; 
            font-weight: bold; 
            padding: 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 50px; 
            background: #6e9bfd; 
            color: #ffffff; 
            box-shadow: 0 5px 0 #726d62;
            transition: 0.1s;
        }

        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #e1b12c; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="title">🎉 派對注音大考驗</div>
        <div id="zhuyin-display">READY</div>
        <button onclick="nextQuestion()">下一個題目 🎁</button>
    </div>

    <script>
        const questions = [
            // --- 第一組：基礎生活類 (1-25) ---
            "ㄅ ㄅ", "ㄇ ㄇ", "ㄉ ㄉ", "ㄍ ㄍ", "ㄋ ㄋ", "ㄏ ㄏ", "ㄒ ㄒ", "ㄎ ㄌ", "ㄅ ㄋ", "ㄐ ㄉ",
            "ㄇ ㄉ", "ㄌ ㄐ", "ㄈ ㄑ", "ㄑ ㄔ", "ㄓ ㄉ", "ㄕ ㄐ", "ㄉ ㄋ", "ㄍ ㄨ", "ㄗ ㄞ", "ㄈ ㄕ",
            "ㄌ ㄏ", "ㄒ ㄒ", "ㄐ ㄗ", "ㄇ ㄅ", "ㄎ ㄌ",
        
            // --- 第二組：動物與自然類 (26-50) ---
            "ㄒ ㄓ", "ㄌ ㄕ", "ㄇ ㄐ", "ㄏ ㄨ", "ㄒ ㄐ", "ㄆ ㄒ", "ㄅ ㄑ", "ㄕ ㄕ", "ㄌ ㄕ", "ㄎ ㄞ",
            "ㄩ ㄧ", "ㄧ ㄌ", "ㄓ ㄓ", "ㄕ ㄨ", "ㄌ ㄎ", "ㄉ ㄒ", "ㄍ ㄆ", "ㄌ ㄌ", "ㄋ ㄋ", "ㄏ ㄐ",
            "ㄗ ㄗ", "ㄇ ㄇ", "ㄉ ㄉ", "ㄅ ㄅ", "ㄈ ㄈ",
        
            // --- 第三組：動作與描述類 (51-75) ---
            "ㄅ ㄆ", "ㄐ ㄨ", "ㄎ ㄋ", "ㄓ ㄋ", "ㄙ ㄋ", "ㄋ ㄌ", "ㄒ ㄕ", "ㄗ ㄖ", "ㄈ ㄐ", "ㄆ ㄅ",
            "ㄍ ㄋ", "ㄐ ㄅ", "ㄍ ㄅ", "ㄊ ㄇ", "ㄙ ㄅ", "ㄎ ㄅ", "ㄒ ㄅ", "ㄓ ㄅ", "ㄋ ㄉ", "ㄩ ㄉ",
            "ㄐ ㄗ", "ㄇ ㄅ", "ㄒ ㄏ", "ㄓ ㄉ", "ㄋ ㄌ",
        
            // --- 第四組：進階生活類 (76-100) ---
            "ㄊ ㄅ", "ㄍ ㄍ", "ㄐ ㄉ", "ㄕ ㄐ", "ㄈ ㄈ", "ㄎ ㄎ", "ㄒ ㄒ", "ㄕ ㄕ", "ㄔ ㄔ", "ㄐ ㄧ",
            "ㄙ ㄙ", "ㄧ ㄧ", "ㄨ ㄈ", "ㄩ ㄩ", "ㄅ ㄔ", "ㄋ ㄇ", "ㄩ ㄇ", "ㄋ ㄊ", "ㄆ ㄧ", "ㄧ ㄇ",
            "ㄍ ㄒ", "ㄐ ㄌ", "ㄊ ㄕ", "ㄨ ㄉ", "ㄕ ㄆ"
        ];

        function nextQuestion() {
            const display = document.getElementById('zhuyin-display');
            let newIndex = Math.floor(Math.random() * questions.length);
            display.innerText = questions[newIndex];
        }
    </script>
</body>
</html>
